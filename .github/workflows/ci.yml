name: ci

on:
  push:
  pull_request:

jobs:
  systemverilog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install HDL simulators
        run: sudo apt-get update && sudo apt-get install -y iverilog ghdl
      - name: Run tests
        run: make test

  repository-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject ROM and BIOS artifacts
        shell: bash
        run: |
          set -euo pipefail
          forbidden=$(find . -type f \( -iname '*.gba' -o -iname '*.gb' -o -iname '*.gbc' -o -iname '*.sfc' -o -iname '*.smc' -o -iname '*bios*.bin' -o -iname '*bios*.rom' \) -print)
          if [[ -n "$forbidden" ]]; then
            echo "$forbidden"
            exit 1
          fi
      - name: Validate JSON
        run: python3 -m json.tool UPSTREAMS.json >/dev/null
